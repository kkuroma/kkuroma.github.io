<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KK's personal website — data scientist, tech enthusiast, and origami artist. Explore projects, blog posts, and more.">
  <!-- Pre-paint theme boot: applies the palette cached by website.js on the
       last visit (website.css :root holds the default palette for first visits).
       Inlined so no render-blocking script requests are needed. Keep in sync
       with editor/index.html. -->
  <script>
    (function () {
      let s = {};
      try { s = JSON.parse(localStorage.getItem('website-state')) || {}; } catch (e) { /* corrupted state */ }
      let variant = s.variant || 'dark';
      if (variant === 'system') {
        variant = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      const root = document.documentElement;
      const palette = s.paletteCache && s.paletteCache[variant];
      if (palette) {
        Object.entries(palette).forEach(([name, value]) => {
          root.style.setProperty(`--${name}`, value);
        });
      }
      const sizes = { small: '14px', medium: '16px', large: '18px', xlarge: '20px' };
      root.style.setProperty('--font-size-base', sizes[s.fontSize] || '16px');
    })();
  </script>
  <link rel="preload" href="assets/fonts/GoogleSansFlex.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/profile.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="website.css">
  <script defer src="themes.js"></script>
  <script defer src="prism.js/prism.js"></script>
  <script defer src="svg-library.js"></script>
  <script defer src="markdown.js"></script>
  <script defer src="website.js"></script>
  <script defer src="blogs/manifest.js"></script>
  <script defer src="blog-loader.js"></script>
  <script defer src="configs/config.js"></script>
  <script defer src="configs/config-projects.js"></script>
  <script defer src="configs/config-services.js"></script>
  <script defer src="configs/config-404.js"></script>
</head>
<body>
  <main id="app">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <p>Loading...</p>
    </div>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      await window.blogLoader.loadAllBlogs();
      const BLOG_CONFIG = window.blogLoader.generateBlogListingConfig();
      window.router.register('/', HOME_CONFIG);
      window.router.register('/projects', PROJECTS_CONFIG);
      window.router.register('/services', SERVICES_CONFIG);
      window.router.register('/blog', BLOG_CONFIG);
      window.router.register('/404', NOT_FOUND_CONFIG);
      window.router.init();
    });
  </script>
</body>
</html>
