<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Editor</title>
  <link rel="icon" href="../assets/icon.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Maple+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../markdown.css">
  <link rel="stylesheet" href="../website.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="app">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-left">
        <a href="../index.html#/" class="nav-link">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M9 22V12h6v10"/></svg> Back to Home
        </a>
        <a href="../index.html#/blog" class="nav-link" style="margin-left: 0.5rem;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg> Back to Blogs
        </a>
      </div>
      <div class="navbar-center">
        <span style="color: var(--blue); font-weight: 600;">Blog Editor</span>
      </div>
      <div class="navbar-right">
        <select id="font-size-select" class="theme-select" title="Font Size"></select>
        <select id="theme-select" class="theme-select"></select>
        <select id="variant-select" class="theme-select" title="Color Mode"></select>
        <button id="toggle-mode-btn" class="editor-btn editor-btn-primary">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> <span id="toggle-mode-text">Preview</span>
        </button>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="editor-container">
      <!-- Edit Mode -->
      <div id="edit-mode" class="edit-mode">
        <!-- Action Buttons -->
        <div class="action-bar">
          <button id="upload-btn" class="editor-btn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg> Upload BLOG_*.js
          </button>
          <button id="export-btn" class="editor-btn editor-btn-success">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Export
          </button>
          <button id="clear-btn" class="editor-btn editor-btn-danger">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg> Clear
          </button>
          <input type="file" id="file-input" accept=".js" style="display: none;">
        </div>

        <!-- Metadata Section -->
        <div class="metadata-section">
          <h2>Blog Metadata</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="title-input">Title *</label>
              <input type="text" id="title-input" placeholder="Enter blog title" required>
            </div>

            <div class="form-group">
              <label for="date-created-input">Date Created *</label>
              <input type="date" id="date-created-input" required>
            </div>

            <div class="form-group">
              <label for="date-updated-input">Date Updated</label>
              <input type="date" id="date-updated-input">
            </div>

            <div class="form-group half-width">
              <label for="tags-input">Tags (comma-separated)</label>
              <input type="text" id="tags-input" placeholder="e.g., opinion, tutorial, fun-fact">
            </div>

            <div class="form-group half-width">
              <label for="preview-img-input">Preview Image URL</label>
              <input type="text" id="preview-img-input" placeholder="e.g., https://example.com/image.png">
            </div>

            <div class="form-group checkbox-group full-width">
              <label>
                <input type="checkbox" id="pinned-input">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> Pin this post
              </label>
            </div>
          </div>
        </div>

        <!-- Content Section -->
        <div class="content-section">
          <div class="content-header">
            <h2>Blog Content (Markdown)</h2>
            <div class="char-count">
              <span id="char-count">0</span> characters
            </div>
          </div>
          <textarea id="content-textarea" placeholder="Write your blog content in markdown here...

# Heading 1
## Heading 2
### Heading 3

Use #TOC to generate a table of contents automatically!

**Bold text**
*Italic text*
`inline code`

```javascript
// Code block
console.log('Hello World');
```

[Link text](https://example.com)
![Image](url){caption, width, height}

- List item 1
- List item 2

> Blockquote

---"></textarea>
        </div>
      </div>

      <!-- Preview Mode -->
      <div id="preview-mode" class="preview-mode" style="display: none;">
        <div id="preview-container"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script defer src="../prism.js/prism.js"></script>
  <script defer src="../themes.js"></script>
  <script defer src="../svg-library.js"></script>
  <script defer src="../markdown.js"></script>
  <script defer src="../website.js"></script>
  <script defer src="parser.js"></script>
  <script defer src="editor.js"></script>
</body>
</html>
